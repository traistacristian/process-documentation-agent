name: Deploy to Azure

# Runs after CI succeeds on main, or manually. Uses OpenID Connect: no Azure secret is stored in GitHub.
# Repository variables (Settings > Secrets and variables > Actions > Variables), all ids, none secret:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (federated credential for this repo, environment "production")
#   AZURE_RESOURCE_GROUP, SHAREPOINT_SITE_URL, SHAREPOINT_LIBRARY
#   COST_PROFILE (free | standard, default free), BUDGET_ALERT_EMAIL
#   AI_PROVIDER (foundry | anthropic | rules), FOUNDRY_RESOURCE_NAME, CLAUDE_MODEL, CLAUDE_EFFORT
#   ENTRA_API_CLIENT_ID, ENTRA_SPA_CLIENT_ID   (printed by scripts/Setup-EntraAndSharePoint.ps1)
# Secret (optional): ANTHROPIC_API_KEY - Claude API key; without it the free profile uses the rule-based engine.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Deployment settings for this tenant (ids, not secrets). A repository variable with the same name overrides each one.
env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || '727f1570-1acd-4ec5-adaf-680980cf70bd' }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || '6c52169d-7009-44da-99d1-40057ca3205d' }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || '22529177-6083-4647-a545-5c1cb175042f' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-process-docs' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
  SHAREPOINT_SITE_URL: ${{ vars.SHAREPOINT_SITE_URL || 'https://pbksupport.sharepoint.com/sites/process-documentation-agent' }}
  SHAREPOINT_LIBRARY: ${{ vars.SHAREPOINT_LIBRARY || 'Documents' }}
  COST_PROFILE: ${{ vars.COST_PROFILE || 'free' }}
  BUDGET_ALERT_EMAIL: ${{ vars.BUDGET_ALERT_EMAIL || '' }}  # empty keeps the existing budget; the address stays out of this public repo
  AI_PROVIDER: ${{ vars.AI_PROVIDER || 'anthropic' }}  # free profile: Claude only when the ANTHROPIC_API_KEY secret exists, else rules
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
  CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT || 'low' }}
  FOUNDRY_RESOURCE_NAME: ${{ vars.FOUNDRY_RESOURCE_NAME || '' }}
  ENTRA_API_CLIENT_ID: ${{ vars.ENTRA_API_CLIENT_ID || '3a4c8535-a9aa-433d-8d21-819f504675b2' }}
  ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID || '495fe82c-7540-4721-ab9e-81ce531c95cc' }}

permissions:
  id-token: write
  contents: read
  actions: read

concurrency: { group: deploy-production, cancel-in-progress: false }

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.workflow_run.head_sha || github.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Build
        run: |
          npm ci && npm test && npm run build
          npm ci --omit=dev
          zip -qr app.zip server config web/dist package.json package-lock.json node_modules -x 'config/local.json'
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure
        id: infra
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          out=$(az deployment group create -g "${{ env.AZURE_RESOURCE_GROUP }}" -f infra/main.bicep \
            -p location="${{ env.AZURE_LOCATION }}" costProfile="${{ env.COST_PROFILE }}" budgetAlertEmail="${{ env.BUDGET_ALERT_EMAIL }}" \
               sharePointSiteUrl="${{ env.SHAREPOINT_SITE_URL }}" \
               sharePointLibrary="${{ env.SHAREPOINT_LIBRARY }}" \
               aiProvider="${{ env.AI_PROVIDER }}" claudeModel="${{ env.CLAUDE_MODEL }}" claudeEffort="${{ env.CLAUDE_EFFORT }}" \
               anthropicApiKey="$ANTHROPIC_API_KEY" \
               foundryResourceName="${{ env.FOUNDRY_RESOURCE_NAME }}" \
               entraApiClientId="${{ env.ENTRA_API_CLIENT_ID }}" \
               entraSpaClientId="${{ env.ENTRA_SPA_CLIENT_ID }}" \
            --query properties.outputs -o json)
          echo "webApp=$(echo "$out" | jq -r .webAppName.value)" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$out" | jq -r .url.value)" >> "$GITHUB_OUTPUT"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.webApp }}
          package: app.zip
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ steps.infra.outputs.url }}/healthz"; then exit 0; fi
            sleep 10
          done
          echo "App did not become healthy"; exit 1
