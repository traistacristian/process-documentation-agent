<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font:13px "Segoe UI",system-ui,sans-serif;width:280px;margin:0;padding:14px;color:#1b2430}
h1{font-size:14px;margin:0 0 10px}.st{padding:8px 10px;border-radius:6px;background:#f1f3f5;margin-bottom:10px}
.rec{background:#ffe3e3;color:#a61e1e;font-weight:600}.pau{background:#fff3bf;color:#8a5a00;font-weight:600}
input{width:100%;box-sizing:border-box;padding:6px;margin:4px 0 8px;border:1px solid #ced4da;border-radius:4px}
button{padding:6px 10px;border:0;border-radius:4px;background:#1f5fa8;color:#fff;cursor:pointer}button.sec{background:#e9ecef;color:#1b2430}
small{color:#5b6b80;display:block;margin-top:8px}
</style></head><body>
<h1>Process Documentation Agent</h1>
<div id="status" class="st">Loading…</div>
<div id="pairBox">
  <label>Server address<input id="api" placeholder="https://processdocs.contoso.com"></label>
  <label>Pairing code (shown on the recording screen)<input id="code" inputmode="numeric" maxlength="6"></label>
  <button id="pair">Connect</button>
</div>
<button id="unpair" class="sec" hidden>Disconnect this browser</button>
<small>Normally pairing happens automatically when you start a recording in the web app. Only pages you visit while recording is active are captured. Password fields are never captured and are blurred in screenshots.</small>
<script src="popup.js"></script>
</body></html>
